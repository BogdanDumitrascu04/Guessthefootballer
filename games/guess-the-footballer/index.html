<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../fonts/fonts.css">
    <link rel="stylesheet" href="game.css">
    <link rel="icon" href="../../images/Header/fotbal.png">
    <title>Guess the Footballer</title>
</head>
<body>
    <header class="header">
        <a class="brand" href="../../index.html">
            <img src="../../images/Header/fotbal.png" alt="" id="logo">
            <span id="mainHeader" data-translate="guessTheFootballer">Guess the footballer</span>
        </a>
        <div class="header-tools">
            <label class="language-selector">
                <span class="visually-hidden">Language</span>
                <select id="language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="ro">Română</option>
                </select>
            </label>
            <button id="infoButton" class="icon-button" aria-label="How to play">ⓘ</button>
            <button id="menuButton" class="icon-button" aria-label="Menu">&#9776;</button>
        </div>
        <div id="infoContent" class="hidden">
            <button id="closeButton" class="icon-button" aria-label="Close">&times;</button>
            <h2 data-translate="howToPlay">How to Play</h2>
            <p data-translate="selectLeague">1. Select a league, a season and a difficulty.</p>
            <p data-translate="guessFootballer">2. Guess the footballer based on the clues provided.</p>
            <p data-translate="enjoyGame">3. Enjoy the game!</p>
        </div>
        <div class="navbar hidden" id="navbar">
            <nav id="menuContent"></nav>
        </div>
    </header>

    <main class="content">
        <section class="picker-section">
            <h2 data-translate="season">Season</h2>
            <div class="option-row" id="seasonRow"></div>
        </section>
        <section class="picker-section">
            <h2 data-translate="difficulty">Difficulty</h2>
            <div class="option-row" id="difficultyRow"></div>
        </section>
        <section class="picker-section">
            <h2 data-translate="chooseLeague">Choose a league</h2>
            <div class="league-grid" id="leagueGrid"></div>
        </section>
    </main>

    <script defer src="i18n.js"></script>
    <script defer src="picker.js"></script>
    <script defer src="ui.js"></script>
</body>
</html>

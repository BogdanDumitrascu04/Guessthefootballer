# Supabase pauses a Free project after about a week with too little database activity,
# and a paused project has to be restored by hand from the dashboard.
name: Keep Supabase awake

on:
  schedule:
    # Daily, off the hour: GitHub delays or drops scheduled runs at busy times, so one missed day is harmless.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: write # to re-enable this workflow, see the last step
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A real query: Supabase counts database activity, not page visits.
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -c "select count(*) from players;"

      # GitHub turns off scheduled workflows in public repos after 60 days without commits.
      # Re-enabling is meant to reset that clock; GitHub does not document it, so its warning email stays the backstop.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-supabase-awake.yml/enable"
